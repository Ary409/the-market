# Configuración de Alembic — las rutas y la URL real se resuelven en alembic/env.py
# (usa el mismo engine de la aplicación para garantizar que se migra la BD correcta).

[alembic]
script_location = alembic
# La URL se inyecta desde app.core.config en env.py; este valor es solo un placeholder.
sqlalchemy.url = sqlite:///./inventario.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
