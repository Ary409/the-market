<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>The Market — Admin Desktop</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; }
  body { background: var(--ink-05); }
  #root { min-height: 100vh; }
  *, *::before, *::after { box-sizing: border-box; }
  button:focus-visible, input:focus-visible, select:focus-visible {
    outline: 2px solid var(--focus-ring); outline-offset: 1px;
  }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  /* hide scrollbars only for cleanliness on the artboard preview */
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<!-- Mock data + shared utils -->
<script src="mockData.js"></script>

<!-- Components — Icon first, then primitives, then shell, then screens, then app -->
<script type="text/babel" data-presets="react" src="Icon.jsx"></script>
<script type="text/babel" data-presets="react" src="components.jsx"></script>
<script type="text/babel" data-presets="react" src="Shell.jsx"></script>
<script type="text/babel" data-presets="react" src="screens/Login.jsx"></script>
<script type="text/babel" data-presets="react" src="screens/Dashboard.jsx"></script>
<script type="text/babel" data-presets="react" src="screens/Inventario.jsx"></script>
<script type="text/babel" data-presets="react" src="screens/Compras.jsx"></script>
<script type="text/babel" data-presets="react" src="screens/Proveedores.jsx"></script>
<script type="text/babel" data-presets="react" src="screens/Reportes.jsx"></script>
<script type="text/babel" data-presets="react" src="screens/Usuarios.jsx"></script>
<script type="text/babel" data-presets="react" src="screens/Caja.jsx"></script>
<script type="text/babel" data-presets="react" src="app.jsx"></script>
</body>
</html>
